name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: debt_book
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        working-directory: .
        run: unzip -o debt_book.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable

      - name: Generate Android files
        run: |
          flutter create --platforms=android --org com.debtbook --project-name debt_book .
          rm -f test/widget_test.dart

      - name: Download Arabic fonts
        run: |
          mkdir -p assets/fonts
          for f in Amiri-Regular Amiri-Bold; do
            curl -fsSL -o assets/fonts/$f.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/amiri/$f.ttf || rm -f assets/fonts/$f.ttf
          done

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: debt-book-apk
          path: debt_book/build/app/outputs/flutter-apk/app-release.apk
